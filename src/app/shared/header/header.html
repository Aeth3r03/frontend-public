<header class="border-b border-line bg-surface sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center gap-4">
        <h1 class="text-xl font-display font-bold shrink-0">Varoe</h1>

        <div class="flex-1 max-w-md mx-auto">
            <input
                type="text"
                placeholder="Buscar productos..."
                class="w-full border border-line rounded-full px-4 py-2 text-sm bg-surface focus:border-purple-border focus:outline-none  focus:ring-2 focus:ring-purple-border/50 transition-colors"
            />
        </div>

        <button 
            (click)="theme.alternar()"
            class="shrink-0 flex items-center gap-2 bg-transparent border border-line rounded-3xl px-3 py-2 text-sm transition-all duration-300 cursor-pointer hover:border-purple-border hover:text-purple-border hover:shadow-[0_0_15px_var(--color-purple-border)]"
        >
            @if (theme.oscuro()) {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
                </svg>
            } @else {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                </svg>
            }
        </button>
    </div>
</header>
